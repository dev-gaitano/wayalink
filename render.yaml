services:
  - type: web
    name: wayalink
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn frontendApi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DATABASE_URL
        fromDatabase:
          name: wayalink-psql-db
          property: connectionString

databases:
  - name: wayalink-psql-db
    databaseName: wayalink_render
    user: wayalink_db_user
